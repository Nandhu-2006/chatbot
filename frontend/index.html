<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Offline Chat</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                ✦
            </div>

            <span>
                Offline Chat
            </span>

        </div>


        <button class="new-chat"
                onclick="newChat()">

            <span>＋</span>

            New chat

        </button>


        <div class="menu">

            <button onclick="showProgram()">

                <span>💻</span>

                Program

            </button>


            <button onclick="showRecent()">

                <span>🕘</span>

                Recent

            </button>


            <button onclick="showPins()">

                <span>📌</span>

                Pins

            </button>

        </div>


        <div class="sidebar-bottom">

            <button>

                ⚙ Settings

            </button>

            <button>

                ❓ Help

            </button>


            <div class="profile">

                <div class="profile-icon">
                    K
                </div>

                <div>

                    <strong>
                        User
                    </strong>

                    <small>
                        Offline mode
                    </small>

                </div>

            </div>

        </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">


        <!-- TOP BAR -->

        <header class="topbar">

            <div class="model-name">

                Offline Chat

                <span class="local">
                    LOCAL
                </span>

            </div>


            <div class="status">

                <span class="status-dot"></span>

                Offline

            </div>

        </header>



        <!-- ================= HOME ================= -->

        <section class="home"
                 id="home">

            <div class="welcome-icon">

                ✦

            </div>


            <h1>
                How can I help you today?
            </h1>


            <p>
                Ask anything. Your AI assistant runs
                completely on your computer.
            </p>


            <div class="suggestions">


                <button onclick="useSuggestion('What is Python?')">

                    <div class="suggestion-icon">
                        🐍
                    </div>

                    <div>

                        <strong>
                            Learn Python
                        </strong>

                        <small>
                            Explain Python simply
                        </small>

                    </div>

                </button>



                <button onclick="useSuggestion('What is 11 + 12?')">

                    <div class="suggestion-icon">
                        🔢
                    </div>

                    <div>

                        <strong>
                            Solve a problem
                        </strong>

                        <small>
                            Get a quick answer
                        </small>

                    </div>

                </button>



                <button onclick="useSuggestion('What is Java?')">

                    <div class="suggestion-icon">
                        ☕
                    </div>

                    <div>

                        <strong>
                            Learn programming
                        </strong>

                        <small>
                            Understand programming
                        </small>

                    </div>

                </button>



                <button onclick="useSuggestion('Explain machine learning in simple words')">

                    <div class="suggestion-icon">
                        🧠
                    </div>

                    <div>

                        <strong>
                            Learn AI
                        </strong>

                        <small>
                            Understand AI concepts
                        </small>

                    </div>

                </button>


            </div>

        </section>



        <!-- ================= CHAT ================= -->

        <section id="chat-area"
                 class="chat-area">

        </section>



        <!-- ================= INPUT ================= -->

        <div class="input-area">


            <div class="input-box">


                <button class="plus-button">
                    ＋
                </button>


                <textarea
                    id="user-input"
                    placeholder="Message Offline Chat..."
                    rows="1">
                </textarea>


                <button
                    class="send-button"
                    onclick="sendMessage()">

                    ↑

                </button>


            </div>


            <p class="disclaimer">

                Offline Chat can make mistakes.
                Check important information.

            </p>

        </div>


    </main>

</div>


<script src="script.js"></script>

</body>

</html>
